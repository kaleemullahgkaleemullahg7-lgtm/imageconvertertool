<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free online PDF merger. Combine multiple PDF files into one document easily.">
    <title>PDF Merger - TutsTools</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- PDF-lib Library -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header class="glass-header">
        <nav class="nav-container">
            <a href="index.html" class="logo" style="text-decoration: none;">TutsTools</a>
            <a href="index.html" style="color: var(--text-main); text-decoration: none; font-weight: 500;">← Back to
                Home</a>
        </nav>
    </header>

    <main class="container">
        <section class="tool-section glass-panel">
            <h1 class="hero-title">PDF Merger</h1>
            <p class="hero-subtitle">Combine multiple PDF files into one document.</p>

            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept="application/pdf" multiple hidden>
                <div class="upload-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M8 7V3M16 7V3M7 11H17M5 21H19C19.5304 21 20.0391 20.7893 20.4142 20.4142C20.7893 20.0391 21 19.5304 21 19V7C21 6.46957 20.7893 5.96086 20.4142 5.58579C20.0391 5.21071 19.5304 5 19 5H5C4.46957 5 3.96086 5.21071 3.58579 5.58579C3.21071 5.96086 3 6.46957 3 7V19C3 19.5304 3.21071 20.0391 3.58579 20.4142C3.96086 20.7893 4.46957 21 5 21Z"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <p>Drag & Drop your PDF files here or <span class="highlight">Browse</span></p>
                    <p class="file-types">Select multiple PDF files to merge</p>
                </div>
            </div>

            <div class="editor-area hidden" id="editorArea">
                <div class="pdf-list" id="pdfList"></div>

                <div class="controls">
                    <div class="action-buttons">
                        <button id="mergeBtn" class="btn-primary">
                            Merge & Download PDF
                        </button>
                        <button id="resetBtn" class="btn-secondary">
                            Upload New Files
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="glass-footer">
        <p>&copy; 2024 TutsTools. All rights reserved.</p>
    </footer>

    <script src="pdf-merger.js"></script>
</body>

</html>
