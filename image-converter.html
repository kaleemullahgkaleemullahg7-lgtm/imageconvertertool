<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Free online image format converter. Convert between PNG, JPG, JPEG, and WEBP formats instantly.">
    <title>Image Converter - TutsTools</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header class="glass-header">
        <nav class="nav-container">
            <a href="index.html" class="logo" style="text-decoration: none;">TutsTools</a>
            <a href="index.html" style="color: var(--text-main); text-decoration: none; font-weight: 500;">← Back to
                Home</a>
        </nav>
    </header>

    <main class="container">
        <section class="tool-section glass-panel">
            <h1 class="hero-title">Image Format Converter</h1>
            <p class="hero-subtitle">Convert your images between PNG, JPG, and WEBP formats instantly.</p>

            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg, image/webp" hidden>
                <div class="upload-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M4 16L8.586 11.414C8.96106 11.0391 9.46967 10.8284 10 10.8284C10.5303 10.8284 11.0389 11.0391 11.414 11.414L16 16M14 14L15.586 12.414C15.9611 12.0391 16.4697 11.8284 17 11.8284C17.5303 11.8284 18.0389 12.0391 18.414 12.414L20 14M14 8H14.01M6 20H18C18.5304 20 19.0391 19.7893 19.4142 19.4142C19.7893 19.0391 20 18.5304 20 18V6C20 5.46957 19.7893 4.96086 19.4142 4.58579C19.0391 4.21071 18.5304 4 18 4H6C5.46957 4 4.96086 4.21071 4.58579 4.58579C4.21071 4.96086 4 5.46957 4 6V18C4 18.5304 4.21071 19.0391 4.58579 19.4142C4.96086 19.7893 5.46957 20 6 20Z"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <p>Drag & Drop your image here or <span class="highlight">Browse</span></p>
                    <p class="file-types">Supports PNG, JPG, WEBP</p>
                </div>
            </div>

            <div class="editor-area hidden" id="editorArea">
                <div class="preview-container">
                    <div class="image-wrapper">
                        <span class="badge">Preview</span>
                        <img id="imagePreview" alt="Image Preview">
                        <div class="file-info" id="fileInfo">0 KB</div>
                    </div>
                </div>

                <div class="controls">
                    <div class="settings-grid" style="grid-template-columns: 1fr;">
                        <div class="control-group">
                            <label for="formatSelect">Convert To:</label>
                            <select id="formatSelect">
                                <option value="image/png">PNG</option>
                                <option value="image/jpeg">JPEG</option>
                                <option value="image/webp">WEBP</option>
                            </select>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button id="convertBtn" class="btn-primary">
                            Convert & Download
                        </button>
                        <button id="resetBtn" class="btn-secondary">
                            Upload New Image
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="glass-footer">
        <p>&copy; 2024 TutsTools. All rights reserved.</p>
    </footer>

    <script src="image-converter.js"></script>
</body>

</html>
